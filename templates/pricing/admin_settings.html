{% extends 'admin_base.html' %}

{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h5 class="fw-bold mb-0">⚙️ 系统设置</h5>
</div>

<div class="card">
  <div class="card-body p-4">
    <form method="post" class="form-card" novalidate>
      {% csrf_token %}
      <div class="mb-4">
        <label class="form-label">押金倍数</label>
        <input type="number" step="0.1" min="0" class="form-control" name="deposit_multiple"
               value="{{ settings.deposit_multiple.value|default:'1' }}">
        <small class="text-muted">押金 = 基础日租金 × 倍数（默认 1，即一天租金）</small>
      </div>
      <div class="mb-4">
        <label class="form-label">违约金倍数</label>
        <input type="number" step="0.1" min="0" class="form-control" name="fine_multiple"
               value="{{ settings.fine_multiple.value|default:'1.5' }}">
        <small class="text-muted">违约金 = 超时天数 × 当日动态日租金 × 倍数（默认 1.5）</small>
      </div>
      <div class="mb-4">
        <label class="form-label">待支付订单自动取消时限（分钟）</label>
        <input type="number" min="1" class="form-control" name="auto_cancel_minutes"
               value="{{ settings.auto_cancel_minutes.value|default:'30' }}">
        <small class="text-muted">超过该时限未支付将自动取消订单</small>
      </div>
      <button class="btn btn-primary" type="submit">保存设置</button>
    </form>
  </div>
</div>
{% endblock %}
