{% extends 'base.html' %}
{% block title %}用户登录 - {{ site_name }}{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="container">
    <div class="card auth-card mx-auto">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <span class="brand-badge mx-auto mb-3" style="width:56px;height:56px;font-size:1.8rem;">🚗</span>
          <h4 class="auth-heading mb-1">欢迎回来</h4>
          <p class="text-muted">登录汽车租赁智能管理系统</p>
        </div>
        <form method="post" novalidate>
          {% csrf_token %}
          {% if form.non_field_errors %}
            <div class="alert alert-danger py-2">{{ form.non_field_errors|striptags }}</div>
          {% endif %}
          <div class="mb-3">
            <label class="form-label">账号</label>
            {{ form.username }}
          </div>
          <div class="mb-3">
            <label class="form-label">密码</label>
            {{ form.password }}
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="remember" id="remember">
              <label class="form-check-label" for="remember">记住登录状态</label>
            </div>
            <a href="{% url 'users:forgot_password' %}" class="small">忘记密码？</a>
          </div>
          <button class="btn btn-primary w-100 py-2" type="submit">登 录</button>
        </form>
        <div class="text-center mt-3 small text-muted">
          还没有账号？<a href="{% url 'users:register' %}" class="fw-bold">立即注册</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
